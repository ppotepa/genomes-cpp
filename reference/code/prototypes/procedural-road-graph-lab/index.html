<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Procedural Road Graph Lab</title>
  <style>
    :root {
      color-scheme: dark;
      --panel: rgba(10,14,20,.88);
      --line: rgba(255,255,255,.12);
      --muted: #9aa4b2;
      --text: #eef2f7;
      --accent: #64d8cb;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #0b1015; color: var(--text); font: 12px/1.35 Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
    #app, canvas { width: 100%; height: 100%; display: block; }
    #ui {
      position: fixed; left: 12px; top: 12px; z-index: 10; width: 340px; max-height: calc(100vh - 24px); overflow: auto;
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; backdrop-filter: blur(10px);
      box-shadow: 0 12px 40px rgba(0,0,0,.35);
    }
    #ui h1 { font-size: 14px; margin: 0 0 10px; letter-spacing: .02em; }
    #ui h2 { font-size: 11px; text-transform: uppercase; color: var(--muted); margin: 14px 0 7px; letter-spacing: .08em; }
    .row { display: grid; grid-template-columns: 1fr 126px; align-items: center; gap: 10px; margin: 7px 0; }
    .row.wide { grid-template-columns: 1fr; }
    label { color: #d8dee8; }
    input, select, button {
      width: 100%; background: #101823; border: 1px solid #263241; color: var(--text); border-radius: 7px; padding: 7px 8px; outline: none;
    }
    input[type="range"] { padding: 0; }
    input[type="checkbox"] { width: auto; accent-color: var(--accent); }
    button { cursor: pointer; font-weight: 650; }
    button:hover { border-color: #4a647d; }
    .buttonRow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .switchGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 10px; }
    .switch { display: flex; gap: 7px; align-items: center; color: #d7dde6; }
    #stats { white-space: pre-wrap; color: #c4ccd7; background: rgba(255,255,255,.035); border: 1px solid var(--line); border-radius: 8px; padding: 8px; min-height: 90px; }
    #status { color: #95e8de; margin-top: 8px; min-height: 16px; }
    .hint { color: var(--muted); font-size: 11px; }
    #legend {
      position: fixed; right: 12px; bottom: 12px; z-index: 8; background: rgba(10,14,20,.76); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; backdrop-filter: blur(8px);
      color: #cdd5df; min-width: 178px;
    }
    .lg { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
    .sw { width: 28px; height: 4px; border-radius: 9px; display: inline-block; }
    .small { font-size: 10px; color: #8f9aa8; }
  </style>
</head>
<body>
<div id="app"></div>
<div id="ui">
  <h1>Procedural Road Graph Lab</h1>
  <div class="row"><label for="preset">Preset morfologii</label><select id="preset"></select></div>
  <div class="row"><label for="seed">Seed</label><input id="seed" value="RTS-URBAN-001" /></div>
  <div class="row"><label for="worldSize">Obszar / skala</label><input id="worldSize" type="range" min="900" max="2200" step="50" value="1500" /></div>
  <div class="row"><label for="density">Gęstość sieci</label><input id="density" type="range" min="0.55" max="1.55" step="0.05" value="1.00" /></div>
  <div class="row"><label for="organic">Organiczność</label><input id="organic" type="range" min="0" max="1" step="0.05" value="0.55" /></div>
  <div class="row"><label for="terrainWeight">Wpływ terenu</label><input id="terrainWeight" type="range" min="0" max="1" step="0.05" value="0.65" /></div>
  <div class="row"><label for="epochs">Epoki wzrostu</label><input id="epochs" type="range" min="1" max="5" step="1" value="3" /></div>
  <div class="buttonRow"><button id="regen">GENERUJ</button><button id="randomSeed">LOSOWY SEED</button></div>

  <h2>Warstwy debug</h2>
  <div class="switchGrid">
    <label class="switch"><input id="showBuildings" type="checkbox" checked />budynki</label>
    <label class="switch"><input id="showBlocks" type="checkbox" checked />bloki</label>
    <label class="switch"><input id="showNodes" type="checkbox" />node'y</label>
    <label class="switch"><input id="showTensor" type="checkbox" />tensor field</label>
    <label class="switch"><input id="showUrbanity" type="checkbox" />urbanity</label>
    <label class="switch"><input id="showNuclei" type="checkbox" checked />nuclei</label>
    <label class="switch"><input id="showTraffic" type="checkbox" />traffic flow</label>
    <label class="switch"><input id="showRejected" type="checkbox" />odrzucone</label>
  </div>

  <h2>Statystyki grafu</h2>
  <div id="stats"></div>
  <div id="status"></div>
  <div class="hint">LPM: obrót · PPM: przesuwanie · kółko: zoom. Generator jest deterministyczny dla tego samego seeda i parametrów.</div>
</div>
<div id="legend">
  <div class="lg"><i class="sw" style="background:#d9d1bb;height:9px"></i> motorway / trunk</div>
  <div class="lg"><i class="sw" style="background:#e4a968;height:7px"></i> arterial</div>
  <div class="lg"><i class="sw" style="background:#c7c8c4;height:5px"></i> collector</div>
  <div class="lg"><i class="sw" style="background:#aeb3b7;height:3px"></i> local</div>
  <div class="lg"><i class="sw" style="background:#8a745e;height:2px"></i> dirt / path</div>
  <div class="small">Kolor debug traffic = przepływ / pojemność</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============================================================
// 0. MODEL PARAMETERS
// ============================================================
const ROAD = Object.freeze({ MOTORWAY:0, TRUNK:1, ARTERIAL:2, COLLECTOR:3, LOCAL:4, SERVICE:5, PATH:6 });
const ROAD_NAMES = ['MOTORWAY','TRUNK','ARTERIAL','COLLECTOR','LOCAL','SERVICE','PATH'];
const ROAD_WIDTH = [16,13,10,7,4.8,3.6,2.2];
const ROAD_SPEED = [110,85,60,42,30,20,12];
const BASE_LENGTH = [260,220,170,115,78,55,42];
const CAPACITY = [2600,2100,1500,900,450,220,90];

const PRESETS = {
  village: {
    label:'Village / wieś', nuclei:[1,2], density:.62, organic:.82, grid:.08, radial:.28, suburban:.15,
    hierarchy:.55, terrain:.88, loops:.12, deadEnds:.48, dirt:.68, ringRoad:.00, macroLoops:.05,
    baseUrbanRadius:230, gatewayCount:2, plannedness:.08, historic:.65
  },
  town: {
    label:'Town / miasteczko', nuclei:[2,4], density:.92, organic:.62, grid:.26, radial:.42, suburban:.35,
    hierarchy:.72, terrain:.66, loops:.32, deadEnds:.27, dirt:.28, ringRoad:.18, macroLoops:.18,
    baseUrbanRadius:320, gatewayCount:3, plannedness:.28, historic:.54
  },
  oldTown: {
    label:'Old town / historyczne', nuclei:[2,3], density:1.12, organic:.86, grid:.10, radial:.68, suburban:.25,
    hierarchy:.66, terrain:.74, loops:.48, deadEnds:.08, dirt:.16, ringRoad:.20, macroLoops:.18,
    baseUrbanRadius:300, gatewayCount:3, plannedness:.06, historic:.92
  },
  plannedCity: {
    label:'Planned city / siatka', nuclei:[2,4], density:1.20, organic:.18, grid:.90, radial:.18, suburban:.42,
    hierarchy:.80, terrain:.30, loops:.74, deadEnds:.06, dirt:.05, ringRoad:.38, macroLoops:.35,
    baseUrbanRadius:380, gatewayCount:4, plannedness:.92, historic:.16
  },
  suburb: {
    label:'Suburb / przedmieścia', nuclei:[3,5], density:.92, organic:.38, grid:.42, radial:.22, suburban:.92,
    hierarchy:.92, terrain:.45, loops:.22, deadEnds:.76, dirt:.08, ringRoad:.18, macroLoops:.22,
    baseUrbanRadius:340, gatewayCount:3, plannedness:.58, historic:.10
  },
  metropolis: {
    label:'Metropolis / wieloośrodkowe', nuclei:[5,8], density:1.42, organic:.40, grid:.52, radial:.48, suburban:.58,
    hierarchy:1.0, terrain:.38, loops:.82, deadEnds:.14, dirt:.03, ringRoad:.82, macroLoops:.58,
    baseUrbanRadius:430, gatewayCount:4, plannedness:.62, historic:.32
  },
  rural: {
    label:'Rural region / rozproszony', nuclei:[2,5], density:.48, organic:.90, grid:.03, radial:.12, suburban:.08,
    hierarchy:.48, terrain:.95, loops:.06, deadEnds:.62, dirt:.84, ringRoad:.00, macroLoops:.02,
    baseUrbanRadius:180, gatewayCount:2, plannedness:.03, historic:.52
  }
};

// ============================================================
// 1. DETERMINISTIC RANDOMNESS + MATH
// ============================================================
function hashString(str) {
  let h = 2166136261 >>> 0;
  for (let i=0;i<str.length;i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function hash32(a,b=0,c=0,d=0) {
  let h = (a ^ Math.imul(b+0x9e3779b9, 0x85ebca6b) ^ Math.imul(c+0xc2b2ae35,0x27d4eb2d) ^ d) >>> 0;
  h ^= h >>> 16; h = Math.imul(h, 0x7feb352d); h ^= h >>> 15; h = Math.imul(h, 0x846ca68b); h ^= h >>> 16;
  return h >>> 0;
}
function mulberry32(seed) {
  let a = seed >>> 0;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function childRng(root,...parts){ let h=root; for(const p of parts) h=hash32(h, typeof p==='string'?hashString(p):p|0); return mulberry32(h); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function lerp(a,b,t){ return a+(b-a)*t; }
function smoothstep(t){ return t*t*(3-2*t); }
function dist2(a,b){ const dx=a.x-b.x, dz=a.z-b.z; return Math.hypot(dx,dz); }
function dot2(a,b){ return a.x*b.x+a.z*b.z; }
function norm2(v){ const l=Math.hypot(v.x,v.z)||1; return {x:v.x/l,z:v.z/l}; }
function perp(v){ return {x:-v.z,z:v.x}; }
function rotate2(v,a){ const c=Math.cos(a),s=Math.sin(a); return {x:v.x*c-v.z*s,z:v.x*s+v.z*c}; }
function angleDiff(a,b){ let d=Math.abs(a-b)% (Math.PI*2); return d>Math.PI?Math.PI*2-d:d; }
function signedArea(poly){ let s=0; for(let i=0,j=poly.length-1;i<poly.length;j=i++) s += poly[j].x*poly[i].z-poly[i].x*poly[j].z; return s*.5; }
function polygonCentroid(poly){
  let A=0,Cx=0,Cz=0;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const f=poly[j].x*poly[i].z-poly[i].x*poly[j].z; A+=f; Cx+=(poly[j].x+poly[i].x)*f; Cz+=(poly[j].z+poly[i].z)*f;
  }
  A*=.5; if(Math.abs(A)<1e-6){ const c=poly.reduce((r,p)=>({x:r.x+p.x,z:r.z+p.z}),{x:0,z:0}); return {x:c.x/poly.length,z:c.z/poly.length}; }
  return {x:Cx/(6*A),z:Cz/(6*A)};
}
function pointInPoly(p,poly){ let inside=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){
  const a=poly[i],b=poly[j]; const hit=((a.z>p.z)!=(b.z>p.z)) && (p.x < (b.x-a.x)*(p.z-a.z)/(b.z-a.z+1e-12)+a.x); if(hit) inside=!inside;
  } return inside;
}
function closestPointSeg(p,a,b){ const vx=b.x-a.x,vz=b.z-a.z, wx=p.x-a.x,wz=p.z-a.z; const t=clamp((wx*vx+wz*vz)/(vx*vx+vz*vz+1e-9),0,1); return {x:a.x+vx*t,z:a.z+vz*t,t}; }
function segIntersection(a,b,c,d){
  const r={x:b.x-a.x,z:b.z-a.z}, s={x:d.x-c.x,z:d.z-c.z}; const den=r.x*s.z-r.z*s.x;
  if(Math.abs(den)<1e-8) return null;
  const q={x:c.x-a.x,z:c.z-a.z}; const t=(q.x*s.z-q.z*s.x)/den, u=(q.x*r.z-q.z*r.x)/den;
  if(t>1e-5 && t<1-1e-5 && u>1e-5 && u<1-1e-5) return {x:a.x+t*r.x,z:a.z+t*r.z,t,u};
  return null;
}
function logNormal(rng,mean,sigma=.22){
  const u1=Math.max(1e-7,rng()),u2=Math.max(1e-7,rng()); const z=Math.sqrt(-2*Math.log(u1))*Math.cos(Math.PI*2*u2);
  return mean*Math.exp(sigma*z-.5*sigma*sigma);
}
function weightedPick(rng,arr){ const sum=arr.reduce((s,a)=>s+a.w,0); let r=rng()*sum; for(const a of arr){ r-=a.w; if(r<=0)return a.v; } return arr[arr.length-1].v; }

// ============================================================
// 2. WORLD FIELD: TERRAIN, RIVER, COST, POPULATION, URBANITY
// ============================================================
class WorldField {
  constructor(seed,size,preset,params){
    this.seed=seed; this.size=size; this.half=size/2; this.preset=preset; this.params=params;
    this.noiseSeed=hash32(seed, 101); this.riverSeed=hash32(seed,202);
    this.riverPhase=childRng(seed,'river')()*Math.PI*2;
    this.riverAmp=size*(.07+childRng(seed,'riverAmp')()*.08);
    this.riverFreq=.85+childRng(seed,'riverFreq')()*.55;
    this.waterLevel=-3.0;
    this.nuclei=[];
  }
  lattice(ix,iz,salt=0){ const h=hash32(this.noiseSeed,ix,iz,salt); return (h/4294967295)*2-1; }
  valueNoise(x,z,scale,salt=0){
    const gx=x/scale, gz=z/scale, ix=Math.floor(gx), iz=Math.floor(gz), fx=gx-ix,fz=gz-iz;
    const sx=smoothstep(fx), sz=smoothstep(fz);
    const a=this.lattice(ix,iz,salt), b=this.lattice(ix+1,iz,salt), c=this.lattice(ix,iz+1,salt), d=this.lattice(ix+1,iz+1,salt);
    return lerp(lerp(a,b,sx),lerp(c,d,sx),sz);
  }
  fbm(x,z){
    let v=0,a=.55,f=1, sum=0;
    for(let o=0;o<5;o++){ v += a*this.valueNoise(x*f,z*f,420,17+o*11); sum+=a; a*=.5; f*=2.03; }
    return v/sum;
  }
  riverCenter(z){
    const t=(z/this.size)+.5;
    return this.riverAmp*(Math.sin((t*this.riverFreq)*Math.PI*2+this.riverPhase)*.62 + Math.sin((t*2.13)*Math.PI*2+this.riverPhase*.73)*.22);
  }
  riverDistance(x,z){ return Math.abs(x-this.riverCenter(z)); }
  riverWidth(z){ return 24 + 11*(.5+.5*Math.sin(z*.008+this.riverPhase)); }
  height(x,z){
    const base=this.fbm(x,z)*24 + this.valueNoise(x,z,900,77)*13;
    const broad=9*Math.sin(x*.0027+1.2)*Math.cos(z*.0021-.7);
    const rd=this.riverDistance(x,z), rw=this.riverWidth(z);
    const carve=Math.exp(-(rd*rd)/(2*(rw*1.8)*(rw*1.8)))*24;
    return base+broad-carve;
  }
  slope(x,z){ const e=5; const hx=(this.height(x+e,z)-this.height(x-e,z))/(2*e); const hz=(this.height(x,z+e)-this.height(x,z-e))/(2*e); return Math.hypot(hx,hz); }
  waterMask(x,z){ return this.riverDistance(x,z) < this.riverWidth(z); }
  obstacle(x,z){
    const s=this.slope(x,z); if(s>.72)return 1;
    return this.waterMask(x,z) ? .72 : 0;
  }
  setNuclei(n){ this.nuclei=n; }
  attraction(x,z){
    let a=0;
    for(const n of this.nuclei){ const d=Math.hypot(x-n.x,z-n.z); a += n.strength*Math.exp(-d/(n.radius*.9)); }
    const valley=Math.exp(-this.riverDistance(x,z)/150)*.12;
    return a+valley;
  }
  population(x,z){
    let p=0;
    for(const n of this.nuclei){ const d=Math.hypot(x-n.x,z-n.z); const q=n.mass*Math.exp(-(d*d)/(2*n.radius*n.radius)); p+=q; }
    p *= (1-clamp(this.slope(x,z)*.55,0,.55));
    if(this.waterMask(x,z)) p*=.08;
    return p;
  }
  urbanity(x,z){
    const p=this.population(x,z), a=this.attraction(x,z);
    const v=1-Math.exp(-(p*.88+a*.55));
    return clamp(v,0,1);
  }
  terrainCost(x,z,roadClass=ROAD.LOCAL){
    const slope=this.slope(x,z); const water=this.waterMask(x,z);
    const tf=lerp(.35,3.2,this.params.terrainWeight*this.preset.terrain);
    let c=1 + tf*slope*slope*5.5;
    if(water) c *= roadClass<=ROAD.ARTERIAL ? 4.5 : 45;
    c /= 1+this.urbanity(x,z)*(.65+this.preset.hierarchy*.5);
    return c;
  }
}

// ============================================================
// 3. EMBEDDED ROAD GRAPH
// ============================================================
class RoadGraph {
  constructor(world,seed){ this.world=world; this.seed=seed; this.nodes=[]; this.edges=[]; this.adj=[]; this.rejected=[]; this.budsDebug=[]; }
  addNode(x,z,type='junction',meta={}){
    const n={id:this.nodes.length,x,z,y:this.world.height(x,z),type,level:meta.level||0,seed:meta.seed||hash32(this.seed,this.nodes.length,7),nucleusId:meta.nucleusId??null};
    this.nodes.push(n); this.adj.push(new Set()); return n.id;
  }
  addEdge(a,b,roadClass,meta={}){
    if(a===b) return -1;
    for(const eid of this.adj[a]){ const e=this.edges[eid]; if(e && !e.dead && ((e.a===a&&e.b===b)||(e.a===b&&e.b===a))) return eid; }
    const A=this.nodes[a],B=this.nodes[b], len=Math.hypot(B.x-A.x,B.z-A.z);
    if(len<3) return -1;
    const u=(this.world.urbanity((A.x+B.x)/2,(A.z+B.z)/2));
    const rng=childRng(this.seed,'surface',a,b,roadClass);
    let surface='asphalt';
    if(roadClass>=ROAD.LOCAL){
      const dirtChance=clamp(this.world.preset.dirt*(1-u)*(roadClass===ROAD.PATH?1.4:1),0,1);
      if(rng()<dirtChance) surface=roadClass===ROAD.PATH?'dirt':(rng()<.55?'gravel':'dirt');
      else if(this.world.preset.historic>.6 && u>.6 && rng()<.38) surface='cobblestone';
    }
    const bridge=meta.bridge ?? (this.world.waterMask((A.x+B.x)/2,(A.z+B.z)/2) && roadClass<=ROAD.ARTERIAL);
    const e={id:this.edges.length,a,b,roadClass,surface,lanes:meta.lanes||this.defaultLanes(roadClass),speed:ROAD_SPEED[roadClass],width:ROAD_WIDTH[roadClass],
      level:bridge?1:(meta.level||0),bridge,tunnel:false,birthEpoch:meta.epoch||0,flow:0,capacity:CAPACITY[roadClass],importance:0,
      parentRoad:meta.parentRoad??null,generation:meta.generation||0,seed:meta.seed||hash32(this.seed,a,b,roadClass),dead:false,zone:'',kind:meta.kind||'grown'};
    this.edges.push(e); this.adj[a].add(e.id); this.adj[b].add(e.id); return e.id;
  }
  defaultLanes(c){ return c===0?4:c===1?3:c===2?2:1; }
  degree(n){ let k=0; for(const eid of this.adj[n]) if(!this.edges[eid].dead) k++; return k; }
  other(e,n){ return e.a===n?e.b:e.a; }
  deactivateEdge(eid){ const e=this.edges[eid]; if(!e||e.dead)return; e.dead=true; this.adj[e.a].delete(eid); this.adj[e.b].delete(eid); }
  splitEdge(eid,x,z,type='junction'){
    const e=this.edges[eid]; if(!e||e.dead)return null;
    const nid=this.addNode(x,z,type,{level:e.level});
    const meta={epoch:e.birthEpoch,generation:e.generation,parentRoad:e.parentRoad,kind:e.kind,level:e.level};
    const rc=e.roadClass,s=e.surface,lanes=e.lanes,flow=e.flow;
    this.deactivateEdge(eid);
    const e1=this.addEdge(e.a,nid,rc,meta), e2=this.addEdge(nid,e.b,rc,meta);
    for(const k of [e1,e2]) if(k>=0){ this.edges[k].surface=s; this.edges[k].lanes=lanes; this.edges[k].flow=flow*.5; }
    return nid;
  }
  nearestNode(p,r,exclude=-1){ let best=-1,bd=r; for(const n of this.nodes){ if(n.id===exclude)continue; const d=Math.hypot(n.x-p.x,n.z-p.z); if(d<bd){bd=d;best=n.id;} } return best; }
  nearestEdgePoint(p,r,excludeNode=-1){
    let best=null,bd=r;
    for(const e of this.edges){ if(e.dead||e.a===excludeNode||e.b===excludeNode)continue; const a=this.nodes[e.a],b=this.nodes[e.b]; const q=closestPointSeg(p,a,b); const d=Math.hypot(q.x-p.x,q.z-p.z); if(d<bd && q.t>.08 && q.t<.92){ bd=d; best={eid:e.id,x:q.x,z:q.z,t:q.t,d}; } }
    return best;
  }
  activeEdges(){ return this.edges.filter(e=>!e.dead); }
  activeNodeIds(){ const s=new Set(); for(const e of this.edges)if(!e.dead){s.add(e.a);s.add(e.b);} return [...s]; }
}

// ============================================================
// 4. PROCEDURAL GENERATOR
// ============================================================
class CityGenerator {
  constructor(params){
    this.params=params; this.seed=hashString(params.seed); this.preset=PRESETS[params.preset];
    this.world=new WorldField(this.seed,params.worldSize,this.preset,params);
    this.graph=new RoadGraph(this.world,this.seed);

  run(status=()=>{}){

  generateNuclei(){
    const rng=childRng(this.seed,'nuclei'); const [mn,mx]=this.preset.nuclei; const count=mn+Math.floor(rng()*(mx-mn+1));
    const half=this.world.half*.76; const main={x:0,z:0};
    for(let i=0;i<count;i++){
      let x=0,z=0,tries=0;
      while(tries++<100){
        if(i===0){ x=(rng()-.5)*this.params.worldSize*.08; z=(rng()-.5)*this.params.worldSize*.08; }
        else { const a=rng()*Math.PI*2; const r=(.18+.55*Math.pow(rng(),.7))*half; x=Math.cos(a)*r; z=Math.sin(a)*r; }
        if(this.world.waterMask(x,z) || this.world.slope(x,z)>.58) continue;
        if(this.nuclei.every(n=>Math.hypot(n.x-x,n.z-z)>this.preset.baseUrbanRadius*.55)) break;

      const strength=i===0?1.35:.72+rng()*.48; const mass=strength*(i===0?1.15:1)*(0.8+rng()*.6);
      const radius=this.preset.baseUrbanRadius*(i===0?1.15:.7+rng()*.45);
      const type=i===0?'historic_center':weightedPick(rng,[{v:'subcenter',w:.34},{v:'village',w:.20},{v:'industrial',w:.18},{v:'station',w:.14},{v:'market',w:.14}]);
      this.nuclei.push({id:i,x,z,strength,mass,radius,type,age:i===0?1:.3+rng()*.5});

    for(const n of this.nuclei) n.nodeId=this.graph.addNode(n.x,n.z,'nucleus',{nucleusId:n.id,seed:hash32(this.seed,900,n.id)});

    const gc=this.preset.gatewayCount; const dirs=[{x:1,z:0},{x:-1,z:0},{x:0,z:1},{x:0,z:-1}];
    for(let i=0;i<gc;i++){
      const d=dirs[(i+Math.floor(rng()*dirs.length))%dirs.length]; const along=(rng()-.5)*this.world.size*.26;
      let x=d.x*this.world.half*.94 + (d.z!==0?along:0), z=d.z*this.world.half*.94 + (d.x!==0?along:0);

  // Tensor field = grid + radial/tangential + terrain tangent + boundary/river tangent + deterministic noise.

    const nrng=childRng(this.seed,'tensorNoise',Math.floor(x/75),Math.floor(z/75),seedSalt); const noiseA=(nrng()-.5)*Math.PI*2;

  generateMacroNetwork(){

    const existing=new Set(chosen.map(([a,b])=>a<b?`${a}-${b}`:`${b}-${a}`));
    const candidates=[];
    for(let i=0;i<N;i++)for(let j=i+1;j<N;j++)if(!existing.has(`${i}-${j}`)){

    for(let k=0;k<Math.min(extra,candidates.length);k++) chosen.push([candidates[k].i,candidates[k].j]);

  insertMacroSegment(startId,targetId,roadClass,meta={}){
    const A=this.graph.nodes[startId], B=this.graph.nodes[targetId];
    const mid={x:(A.x+B.x)/2,z:(A.z+B.z)/2};

    const crossings=[];

  }

  routeMacro(startId,endId,roadClass,salt){

  growEpoch(epoch){

        const base=this.tensorDirection(n.x,n.z,epoch===0?ROAD.ARTERIAL:ROAD.COLLECTOR,k+epoch*31); const dir=rotate2(base,(k/count)*Math.PI*2 + (rng()-.5)*.55);

  runBudQueue(queue,target,epoch){

      const current=norm2(bud.dir); const align=dot2(current,field); const prefer=align<-.2?{x:-field.x,z:-field.z}:field;

      }
    }
  }

  evaluateCandidate(n,p,dir,roadClass,bud,ci){

    }

    if(Math.hypot(target.x-A.x,target.z-A.z)<12) return null;

  }

  simulateTraffic(){
    for(const e of this.graph.edges)e.flow=0;
    const anchors=[...this.nuclei.map(n=>({nodeId:n.nodeId,mass:n.mass*120})),...this.gateways.map(g=>({nodeId:g.nodeId,mass:100}))];
    for(let i=0;i<anchors.length;i++)for(let j=i+1;j<anchors.length;j++){
      const a=anchors[i],b=anchors[j]; const direct=dist2(this.graph.nodes[a.nodeId],this.graph.nodes[b.nodeId]); const demand=a.mass*b.mass*Math.exp(-direct/(this.world.size*.48))*0.010;
      const path=this.shortestPath(a.nodeId,b.nodeId); if(!path)continue; for(const eid of path.edges) this.graph.edges[eid].flow += demand;
    }
    const maxFlow=Math.max(1,...this.graph.activeEdges().map(e=>e.flow)); for(const e of this.graph.edges)if(!e.dead) e.importance=e.flow/maxFlow;
  }

  shortestPath(start,goal){
    const N=this.graph.nodes.length, dist=new Float64Array(N); dist.fill(Infinity); const prevE=new Int32Array(N); prevE.fill(-1); const prevN=new Int32Array(N); prevN.fill(-1); const seen=new Uint8Array(N); dist[start]=0;
    const q=[{n:start,d:0}];
    while(q.length){ let bi=0; for(let i=1;i<q.length;i++)if(q[i].d<q[bi].d)bi=i; const cur=q.splice(bi,1)[0]; if(seen[cur.n])continue; seen[cur.n]=1; if(cur.n===goal)break;
      for(const eid of this.graph.adj[cur.n]){ const e=this.graph.edges[eid]; if(!e||e.dead)continue; const to=this.graph.other(e,cur.n),A=this.graph.nodes[cur.n],B=this.graph.nodes[to]; const len=Math.hypot(B.x-A.x,B.z-A.z); const w=len/(e.speed+1)*(1+.18*e.flow/(e.capacity+1)); const nd=dist[cur.n]+w; if(nd<dist[to]){dist[to]=nd;prevE[to]=eid;prevN[to]=cur.n;q.push({n:to,d:nd});}
      }
    }
    if(!Number.isFinite(dist[goal]))return null; const edges=[]; let n=goal,guard=0; while(n!==start&&guard++<N){ const e=prevE[n]; if(e<0)break; edges.push(e); n=prevN[n]; } edges.reverse(); return {edges,cost:dist[goal]};
  }

  applyTrafficFeedback(){
    for(const e of this.graph.edges){ if(e.dead)continue; const ratio=e.flow/(e.capacity+1);
      if(ratio>1.15 && e.roadClass>ROAD.TRUNK){ e.roadClass--; e.lanes=Math.min(4,e.lanes+1); e.width=ROAD_WIDTH[e.roadClass]; e.speed=ROAD_SPEED[e.roadClass]; e.capacity=CAPACITY[e.roadClass]*(1+.28*(e.lanes-1)); e.surface='asphalt'; }
      else if(e.surface==='dirt' && e.flow>CAPACITY[ROAD.PATH]*.45){ e.surface=e.roadClass<=ROAD.LOCAL?'asphalt':'gravel'; }
    }
  }

  maybeBuildBypass(){
    const active=this.graph.activeEdges(); const congested=active.filter(e=>e.roadClass<=ROAD.ARTERIAL && e.flow/(e.capacity+1)>.65);
    if(congested.length<2 && this.preset.ringRoad<.65)return;
    const c=this.nuclei[0], rng=childRng(this.seed,'bypass'); const radius=this.world.size*(.22+.06*rng())*(.85+this.preset.suburban*.25); const segments=10;
    const ring=[];
    for(let i=0;i<segments;i++){
      const a=(i/segments)*Math.PI*2; let x=c.x+Math.cos(a)*radius,z=c.z+Math.sin(a)*radius;
      // nudge away from river/water and steep terrain.
      for(let k=0;k<5;k++){ if(!this.world.waterMask(x,z)&&this.world.slope(x,z)<.55)break; x+=Math.cos(a)*18; z+=Math.sin(a)*18; }
      ring.push(this.graph.addNode(x,z,'bypass',{seed:hash32(this.seed,808,i)}));
    }
    for(let i=0;i<segments;i++) this.graph.addEdge(ring[i],ring[(i+1)%segments],this.preset.hierarchy>.9?ROAD.TRUNK:ROAD.ARTERIAL,{kind:'bypass',epoch:this.params.epochs,generation:0,parentRoad:999});
    // Connect ring to nearby existing major roads.
    for(let i=0;i<segments;i+=2){ const n=this.graph.nodes[ring[i]]; let best=-1,bd=120; for(const id of this.graph.activeNodeIds()){ if(id===ring[i])continue; const q=this.graph.nodes[id],d=dist2(n,q); if(d<bd && this.graph.adj[id] && [...this.graph.adj[id]].some(eid=>this.graph.edges[eid].roadClass<=ROAD.ARTERIAL)){bd=d;best=id;} } if(best>=0)this.graph.addEdge(ring[i],best,ROAD.ARTERIAL,{kind:'bypassConnector',epoch:this.params.epochs}); }
    this.simulateTraffic(); this.applyTrafficFeedback();
  }

  secondaryGrowth(){
    const rng=childRng(this.seed,'secondary'); const starts=[];
    for(const e of this.graph.activeEdges()){
      if(e.roadClass>ROAD.COLLECTOR || rng()>.10*this.params.density)continue;
      for(const id of [e.a,e.b]){ if(this.graph.degree(id)>5)continue; const n=this.graph.nodes[id]; const d=perp(norm2({x:this.graph.nodes[this.graph.other(e,id)].x-n.x,z:this.graph.nodes[this.graph.other(e,id)].z-n.z})); starts.push({nodeId:id,dir:rng()<.5?d:{x:-d.x,z:-d.z},roadClass:ROAD.LOCAL,energy:3,generation:0,epoch:this.params.epochs,seed:hash32(this.seed,991,id)}); }
    }
    this.runBudQueue(starts,Math.round(90*this.params.density*this.preset.density),this.params.epochs);
  }

  classifyZones(){
    for(const e of this.graph.edges){ if(e.dead)continue; const a=this.graph.nodes[e.a],b=this.graph.nodes[e.b],u=this.world.urbanity((a.x+b.x)/2,(a.z+b.z)/2); e.zone=u>.78?'centre':u>.56?'urban':u>.31?'suburb':u>.14?'rural':'wild'; }
  }

  extractBlocks(){
    // Half-edge face walk. Works because grown crossings split existing edges.
    const adjSorted=new Map();
    for(const nid of this.graph.activeNodeIds()){
      const n=this.graph.nodes[nid], list=[];
      for(const eid of this.graph.adj[nid]){ const e=this.graph.edges[eid]; if(!e||e.dead||e.level!==0)continue; const o=this.graph.nodes[this.graph.other(e,nid)]; list.push({to:o.id,eid,ang:Math.atan2(o.z-n.z,o.x-n.x)}); }
      list.sort((a,b)=>a.ang-b.ang); if(list.length)adjSorted.set(nid,list);
    }
    const visited=new Set(), faces=[];
    const key=(a,b)=>`${a}>${b}`;
    for(const [u,list] of adjSorted){ for(const item of list){ const v=item.to; if(visited.has(key(u,v)))continue; const polyIds=[]; let a=u,b=v,guard=0,closed=false;
      while(guard++<500){ const k=key(a,b); if(visited.has(k)){ if(a===u&&b===v)closed=true; break; } visited.add(k); polyIds.push(a);
        const nextList=adjSorted.get(b); if(!nextList||nextList.length<2)break; const idx=nextList.findIndex(x=>x.to===a); if(idx<0)break; const next=nextList[(idx-1+nextList.length)%nextList.length]; const c=next.to; a=b; b=c; if(a===u&&b===v){closed=true;break;}
      }
      if(!closed||polyIds.length<3)continue; const poly=polyIds.map(id=>({x:this.graph.nodes[id].x,z:this.graph.nodes[id].z})); const area=signedArea(poly);
      if(area>500 && area<this.world.size*this.world.size*.16){
        const c=polygonCentroid(poly); if(Math.abs(c.x)<this.world.half*.98&&Math.abs(c.z)<this.world.half*.98) faces.push({id:faces.length,poly,area,centroid:c,urbanity:this.world.urbanity(c.x,c.z)});
      }
    }}
    // Deduplicate faces by centroid/area.
    const out=[]; for(const f of faces){ if(out.some(g=>dist2(f.centroid,g.centroid)<8 && Math.abs(f.area-g.area)/Math.max(f.area,g.area)<.08))continue; out.push(f); }
    return out.sort((a,b)=>b.area-a.area).slice(0,420);
  }

  generateBuildings(){
    const result=[]; const rng=childRng(this.seed,'buildings');
    for(const block of this.blocks){ const u=block.urbanity; if(block.area<900||block.area>65000)continue; const c=block.centroid; const minx=Math.min(...block.poly.map(p=>p.x)),maxx=Math.max(...block.poly.map(p=>p.x)),minz=Math.min(...block.poly.map(p=>p.z)),maxz=Math.max(...block.poly.map(p=>p.z));
      const spacing=lerp(46,21,u)*lerp(1.15,.86,this.params.density); const setback=lerp(13,8,u); let count=0;
      for(let x=minx+spacing*.5;x<maxx;x+=spacing){ for(let z=minz+spacing*.5;z<maxz;z+=spacing){ if(count>28)break; const jx=x+(rng()-.5)*spacing*.32,jz=z+(rng()-.5)*spacing*.32; if(!pointInPoly({x:jx,z:jz},block.poly))continue;
        // Ensure basic setback from block edges.
        let md=Infinity, edgeAngle=0; for(let i=0,j=block.poly.length-1;i<block.poly.length;j=i++){
          const a=block.poly[j],b=block.poly[i],q=closestPointSeg({x:jx,z:jz},a,b),d=Math.hypot(jx-q.x,jz-q.z); if(d<md){md=d;edgeAngle=Math.atan2(b.z-a.z,b.x-a.x);} }
        if(md<setback)continue;
        const w=spacing*(.48+rng()*.24), d=spacing*(.42+rng()*.24); const floors=u>.8?2+Math.floor(rng()*6):u>.55?2+Math.floor(rng()*3):1+Math.floor(rng()*2); const h=floors*(2.8+rng()*.8);
        result.push({x:jx,z:jz,w,d,h,angle:edgeAngle+(rng()-.5)*.10,zone:u>.78?'centre':u>.55?'urban':u>.3?'suburb':'rural'}); count++;

    }
    return result.slice(0,4500);
  }

  computeTensorSamples(){
    this.tensorSamples=[]; const n=17; for(let iz=1;iz<n-1;iz++)for(let ix=1;ix<n-1;ix++){ const x=lerp(-this.world.half,this.world.half,ix/(n-1)),z=lerp(-this.world.half,this.world.half,iz/(n-1)); const d=this.tensorDirection(x,z,ROAD.LOCAL,ix+iz*31); this.tensorSamples.push({x,z,dx:d.x,dz:d.z}); }
  }
}

function buildTerrain(gen){

const roadColors=[0xd9d1bb,0xd9d1bb,0xe4a968,0xc7c8c4,0xaeb3b7,0x8d9297,0x8a745e];
function edgeTransform(gen,e,obj,trafficMode=false){
  const a=gen.graph.nodes[e.a],b=gen.graph.nodes[e.b]; const dx=b.x-a.x,dz=b.z-a.z,dy=b.y-a.y; const len=Math.hypot(dx,dz), midx=(a.x+b.x)/2,midz=(a.z+b.z)/2,midy=(a.y+b.y)/2 + (e.bridge?4.5:1.1);

function buildRoads(gen){
  const active=gen.graph.activeEdges(); const baseGeo=new THREE.BoxGeometry(1,1,1);
  for(let rc=0;rc<=6;rc++){
    const arr=active.filter(e=>e.roadClass===rc); if(!arr.length)continue; const mat=new THREE.MeshStandardMaterial({color:roadColors[rc],roughness:.88,metalness:0}); const inst=new THREE.InstancedMesh(baseGeo,mat,arr.length); const dummy=new THREE.Object3D(); let i=0;
    for(const e of arr){ edgeTransform(gen,e,dummy); dummy.updateMatrix(); inst.setMatrixAt(i++,dummy.matrix); } inst.instanceMatrix.needsUpdate=true; groups.roads.add(inst);
  }

}

function buildBlocks(gen){
  for(const b of gen.blocks){ const sh=new THREE.Shape(); sh.moveTo(b.poly[0].x,b.poly[0].z); for(let i=1;i<b.poly.length;i++)sh.lineTo(b.poly[i].x,b.poly[i].z); sh.closePath(); const geo=new THREE.ShapeGeometry(sh); geo.rotateX(Math.PI/2); // Shape x/y -> x/z; then y axis becomes -z, fix scale below.
    const pos=geo.attributes.position; for(let i=0;i<pos.count;i++){ const x=pos.getX(i),z=pos.getZ(i); pos.setXYZ(i,x,gen.world.height(x,z)+.45,z); }
    geo.computeVertexNormals(); const col=b.urbanity>.75?0x796f62:b.urbanity>.45?0x6f735d:0x657052; const mesh=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:.20,side:THREE.DoubleSide,depthWrite:false})); groups.blocks.add(mesh);
  }
}

function buildBuildings(gen){

}

function updateStats(gen){
  const edges=gen.graph.activeEdges(), nodes=gen.graph.activeNodeIds(); const totalKm=edges.reduce((s,e)=>s+dist2(gen.graph.nodes[e.a],gen.graph.nodes[e.b]),0)/1000;

const $=id=>document.getElementById(id); let current=null;
function paramsFromUI(){ return { preset:presetEl.value, seed:$('seed').value.trim()||'seed', worldSize:+$('worldSize').value, density:+$('density').value, organic:+$('organic').value, terrainWeight:+$('terrainWeight').value, epochs:+$('epochs').value }; }
function applyVisibility(){ groups.buildings.visible=$('showBuildings').checked; groups.blocks.visible=$('showBlocks').checked; groups.nodes.visible=$('showNodes').checked; groups.tensor.visible=$('showTensor').checked; groups.urbanity.visible=$('showUrbanity').checked; groups.nuclei.visible=$('showNuclei').checked; groups.traffic.visible=$('showTraffic').checked; groups.rejected.visible=$('showRejected').checked; }
for(const id of ['showBuildings','showBlocks','showNodes','showTensor','showUrbanity','showNuclei','showTraffic','showRejected']) $(id).addEventListener('change',applyVisibility);

async function regenerate(){
  const status=$('status'); status.textContent='Generowanie…'; $('regen').disabled=true; await new Promise(r=>setTimeout(r,20));
  try{
    clearScene(); const p=paramsFromUI(); const gen=new CityGenerator(p); current=gen;
    gen.run(s=>status.textContent=s);
    buildTerrain(gen); buildRoads(gen); buildBlocks(gen); buildBuildings(gen); buildNodes(gen); buildNuclei(gen); buildTensor(gen); buildUrbanity(gen); buildTraffic(gen); buildRejected(gen); applyVisibility(); updateStats(gen);
    const camDist=p.worldSize*.85; camera.position.set(camDist*.82,camDist*.64,camDist*.82); controls.target.set(0,0,0); controls.update();
    status.textContent=`Gotowe · seed ${p.seed}`;
  }catch(err){ console.error(err); status.textContent='Błąd: '+err.message; }
  $('regen').disabled=false;
}
$('regen').addEventListener('click',regenerate); $('randomSeed').addEventListener('click',()=>{ $('seed').value='CITY-'+Math.random().toString(36).slice(2,9).toUpperCase(); regenerate(); });
presetEl.addEventListener('change',()=>{ const p=PRESETS[presetEl.value]; $('organic').value=p.organic; $('terrainWeight').value=p.terrain; $('density').value=clamp(p.density,.55,1.55); });

addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); } animate();
regenerate();
</script>
</body>
</html>
