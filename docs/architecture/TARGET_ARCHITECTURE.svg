  <path d="M945 575H985" class="edge" stroke="#58a6ff" marker-end="url(#arrow-blue)"/><text x="965" y="566" text-anchor="middle" class="edge-label">extract</text>
  <path d="M1170 575H1205" class="edge" stroke="#a371f7" marker-end="url(#arrow-purple)"/><text x="1187" y="566" text-anchor="middle" class="edge-label">present</text>
  <path d="M1412 435V465H1330V485" class="edge" stroke="#a371f7" marker-end="url(#arrow-purple)"/><text x="1388" y="458" text-anchor="end" class="edge-label">register</text>
  <path d="M942 202V232H775V260" class="edge" stroke="#a371f7" stroke-dasharray="6 5" marker-end="url(#arrow-purple)"/><text x="846" y="226" class="edge-label">uses</text>
  <path d="M290 595H325V575H635" class="edge" stroke="#d29922" stroke-dasharray="6 5" marker-end="url(#arrow-gold)"/><text x="360" y="566" class="edge-label">TARGET validation</text>
